<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina Vision — Neural Engine AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--card:#111122;--border:rgba(255,255,255,.08);--accent:#8b5cf6;--cyan:#22d3ee;--green:#22c55e;--red:#ef4444;--gold:#f59e0b;--text:#e5e7eb;--muted:#6b7280}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;height:100vh}
.header{grid-column:1/-1;background:rgba(17,17,34,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;z-index:100}
.header .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:16px}
.header h1{font-size:16px;font-weight:800;color:#fff}
.header .version{font-size:10px;color:var(--muted);font-family:'Courier New',monospace;border:1px solid var(--border);border-radius:6px;padding:2px 6px}
.header .token-badge{margin-left:auto;display:flex;align-items:center;gap:10px}
.token-gauge{display:flex;align-items:center;gap:6px}
.token-gauge .tg-label{font-size:10px;color:var(--muted);font-family:'Courier New',monospace}
.token-gauge .tg-bar{width:90px;height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.token-gauge .tg-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));width:0;transition:width .4s}
.sidebar{background:#0d0d1c;border-right:1px solid var(--border);padding:16px;overflow-y:auto}
.sidebar .nav{list-style:none}
.sidebar .nav li{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:4px;transition:all .2s}
.sidebar .nav li:hover,.sidebar .nav li.active{background:rgba(139,92,246,.12);color:#c4b5fd}
.sidebar .nav li.active{border-left:3px solid var(--accent)}
.sidebar .section{margin-top:20px}
.sidebar .section h4{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:0 14px;margin-bottom:8px}
.sidebar .config-field{margin-bottom:10px;padding:0 14px}
.sidebar .config-field label{font-size:10px;color:var(--muted);margin-bottom:4px;display:block}
.sidebar .config-field input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:#fff;font-size:11px;font-family:inherit}
.sidebar .config-field input:focus,select:focus{outline:none;border-color:var(--accent)}
.sidebar .save-btn{width:calc(100% - 28px);margin:0 14px;padding:9px;background:linear-gradient(135deg,var(--accent),var(--cyan));border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.sidebar .save-btn:hover{opacity:.9}
.chat{display:flex;flex-direction:column;height:100%}
.chat-tabs{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);background:rgba(17,17,34,.5)}
.chat-tab{padding:7px 16px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--border);transition:all .2s}
.chat-tab.active{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.4);color:#c4b5fd}
.messages{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:80%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;white-space:pre-wrap;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(34,211,238,.15));border:1px solid rgba(139,92,246,.3);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.system{align-self:center;background:rgba(255,255,255,.02);border:1px dashed var(--border);color:var(--muted);font-size:12px}
.msg .msg-meta{display:flex;gap:10px;margin-top:8px;font-size:10px;color:var(--muted);font-family:'Courier New',monospace;flex-wrap:wrap}
.msg .msg-meta .tok{color:var(--gold)}
.msg .msg-meta .lat{color:var(--cyan)}
.msg .msg-meta .model{color:var(--accent)}
.cursor{display:inline-block;width:8px;height:16px;background:var(--cyan);animation:blinkc .8s infinite;vertical-align:middle}
@keyframes blinkc{0%,100%{opacity:1}50%{opacity:0}}
.input-area{padding:16px 20px;border-top:1px solid var(--border);background:rgba(17,17,34,.6)}
.input-row{display:flex;gap:10px}
.input-row textarea{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:#fff;font-family:inherit;font-size:14px;min-height:44px;max-height:140px;resize:vertical}
.input-row textarea:focus{outline:none;border-color:var(--accent)}
.send-btn{padding:12px 24px;background:linear-gradient(135deg,var(--accent),var(--cyan));border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .2s}
.send-btn:hover{opacity:.9}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.input-hint{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.input-hint span b{color:var(--accent);font-weight:600}
.events-panel{flex:1;overflow-y:auto;padding:16px 20px;font-family:'Courier New',monospace;font-size:11px;line-height:1.8}
.event-line{margin-bottom:4px;word-break:break-word}
.event-line .el-time{color:rgba(255,255,255,.25);margin-right:8px}
.event-line.info{color:var(--muted)}
.event-line.success{color:var(--green)}
.event-line.warn{color:var(--gold)}
.event-line.error{color:var(--red)}
.event-line.debug{color:rgba(255,255,255,.5)}
.event-line .bright{color:#fff}
@media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{display:none}.msg{max-width:92%}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">🧠</div>
    <h1>Lumina Vision</h1>
    <span class="version">NEURAL ENGINE v1.0.0</span>
    <div class="token-badge">
      <div class="token-gauge">
        <span class="tg-label" id="tokenLabel">0 / 128k</span>
        <div class="tg-bar"><div class="tg-fill" id="tokenFill"></div></div>
      </div>
    </div>
  </header>

  <aside class="sidebar">
    <ul class="nav">
      <li class="active" data-view="chat">💬 Chat Studio</li>
      <li data-view="events">📋 Engine Logs</li>
    </ul>
    <div class="section">
      <h4>Engine Configuration</h4>
      <div class="config-field"><label>Model</label>
        <select id="cfModel"><option>gpt-4o</option><option>gpt-4o-mini</option><option>gpt-4-turbo</option><option>gpt-3.5-turbo</option></select>
      </div>
      <div class="config-field"><label>Max Tokens</label><input type="number" id="cfMaxTokens" value="1024" min="64" max="128000"></div>
      <div class="config-field"><label>Temperature</label><input type="number" id="cfTemp" value="0.7" min="0" max="2" step="0.1"></div>
      <div class="config-field"><label>Top P</label><input type="number" id="cfTopP" value="1" min="0.1" max="1" step="0.05"></div>
      <div class="config-field"><label>Max Retries</label><input type="number" id="cfRetries" value="3" min="0" max="5"></div>
      <div class="config-field"><label>OpenAI API Key (optional)</label><input type="password" id="cfApiKey" placeholder="sk-..."></div>
      <div class="config-field"><label>System Prompt</label><textarea id="cfSystem" rows="3" style="background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:#fff;font-size:11px;width:100%;font-family:inherit">You are a senior software architect. Be concise and precise.</textarea></div>
      <button class="save-btn" onclick="saveConfig()">Apply Configuration</button>
    </div>
  </aside>

  <div class="chat">
    <div class="chat-tabs">
      <div class="chat-tab active" data-tab="chat">Chat with Context</div>
      <div class="chat-tab" data-tab="completion">One-shot Completion</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="events-panel" id="events" style="display:none"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" placeholder="Message the Neural Engine..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send ⏎</button>
      </div>
      <div class="input-hint">
        <span>▶ <b>multi-turn</b> memory retained</span>
        <span>▶ <b>token budget</b> auto-trim</span>
        <span>▶ <b>retry</b> with backoff</span>
      </div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// NeuralEngine — Lumina Vision
// Port of 33-lumina-vision engine (token manager, stream handler, retry)
// ─────────────────────────────────────────────

const MODEL_TOKEN_LIMITS = {
  'gpt-4o': 128000, 'gpt-4o-mini': 128000, 'gpt-4-turbo': 128000, 'gpt-4': 8192, 'gpt-3.5-turbo': 16385
};

class TokenManager {
  constructor() { this.encoder = null; }

  countTextTokens(text) {
    text = String(text || '');
    if (this.encoder && typeof this.encoder.encode === 'function') {
      try { return this.encoder.encode(text).length; } catch (e) {}
    }
    // Estimate ~4 chars per token (cl100k_base approximation)
    return Math.ceil(text.length / 4);
  }

  countMessageTokens(messages) {
    let total = 3;
    for (const m of messages) {
      total += 4;
      total += this.countTextTokens(m.content);
      total += this.countTextTokens(m.role);
      if (m.name) { total += this.countTextTokens(m.name); total -= 1; }
    }
    return total;
  }

  getModelLimit(model) { return MODEL_TOKEN_LIMITS[model] || 8192; }

  validateTokenBudget(messages, model, maxTokens) {
    const modelLimit = this.getModelLimit(model);
    const messageTokens = this.countMessageTokens(messages);
    const totalRequired = messageTokens + maxTokens;
    logger.debug('Token budget check', { messageTokens, maxTokens, totalRequired, modelLimit });
    if (totalRequired > modelLimit) {
      throw { name: 'TokenLimitError', code: 'TOKEN_LIMIT', tokenCount: totalRequired, limit: modelLimit, message: 'Token limit exceeded: ' + totalRequired + ' tokens (limit: ' + modelLimit + ')' };
    }
  }

  trimToFit(messages, model, maxTokens) {
    const modelLimit = this.getModelLimit(model);
    const targetLimit = modelLimit - maxTokens - 100;
    const systemMessages = messages.filter(m => m.role === 'system');
    const nonSystemMsgs = messages.filter(m => m.role !== 'system');
    let trimmed = [...nonSystemMsgs];
    while (trimmed.length > 1 && this.countMessageTokens([...systemMessages, ...trimmed]) > targetLimit) {
      trimmed.shift();
    }
    logger.debug('Messages trimmed to fit token budget', { originalCount: messages.length, trimmedCount: systemMessages.length + trimmed.length });
    return [...systemMessages, ...trimmed];
  }
}

// ─── Retry with exponential backoff ───────────────────
const DEFAULT_RETRY = { maxRetries: 3, baseDelayMs: 1000, maxDelayMs: 30000, jitter: true };
function calculateDelay(attempt, options) {
  const exp = Math.min(options.baseDelayMs * Math.pow(2, attempt), options.maxDelayMs);
  const jitterFactor = options.jitter ? 0.8 + Math.random() * 0.4 : 1;
  return Math.floor(exp * jitterFactor);
}
function isRetryable(error) {
  if (error && error.retryable) return true;
  if (error && error.message) {
    return error.message.includes('ECONNRESET') || error.message.includes('ETIMEDOUT') ||
           error.message.includes('socket hang up') || error.message.includes('429') || error.message.includes('500');
  }
  return false;
}
async function withRetry(fn, options) {
  const config = Object.assign({}, DEFAULT_RETRY, options);
  let lastError;
  for (let attempt = 0; attempt <= config.maxRetries; attempt++) {
    try {
      if (attempt > 0) {
        const delay = calculateDelay(attempt - 1, config);
        logger.warn('Retry attempt ' + attempt + '/' + config.maxRetries + ' after ' + delay + 'ms');
        await sleep(delay);
      }
      return await fn();
    } catch (error) {
      lastError = error;
      if (error && error.retryAfter) { await sleep(error.retryAfter * 1000); continue; }
      if (!isRetryable(error)) throw error;
      if (attempt === config.maxRetries) break;
      logger.warn('Attempt ' + (attempt + 1) + ' failed, will retry');
    }
  }
  throw lastError;
}

// ─── Logger ────────────────────────────────────────
const eventsDiv = document.getElementById('events');
function logger(method, message, meta) {
  const line = document.createElement('div');
  line.className = 'event-line ' + method;
  const metaStr = meta ? ' ' + JSON.stringify(meta) : '';
  line.innerHTML = '<span class="el-time">[' + new Date().toLocaleTimeString() + ']</span>' + (method === 'info' ? '<span class="bright">INFO</span>: ' : method.toUpperCase() + ': ') + message + metaStr;
  eventsDiv.prepend(line);
  if (eventsDiv.children.length > 200) eventsDiv.removeChild(eventsDiv.lastChild);
}
logger.info = (m, meta) => logger('info', m, meta);
logger.warn = (m, meta) => logger('warn', m, meta);
logger.error = (m, meta) => logger('error', m, meta);
logger.debug = (m, meta) => logger('debug', m, meta);
logger.success = (m, meta) => logger('success', m, meta);

// ─── Stream Handler ────────────────────────────────
class StreamHandler {
  async processStream(tokens, callbacks) {
    let fullContent = '', completionTokens = 0, finishReason = 'stop';
    for (const token of tokens) {
      if (!token) continue;
      fullContent += token;
      completionTokens++;
      if (callbacks && callbacks.onToken) callbacks.onToken(token);
    }
    if (callbacks && callbacks.onComplete) callbacks.onComplete(fullContent);
    logger.debug('Stream completed', { tokens: completionTokens, finishReason, contentLength: fullContent.length });
    return { content: fullContent, completionTokens, finishReason };
  }
}

// ─── Simulated GPT-4o response library ─────────────
const RESPONSE_DB = [
  { match: ['SOLID', 'solid'], reply: 'SOLID stands for five design principles:\n\n1. Single Responsibility — a class should have one reason to change\n2. Open/Closed — open for extension, closed for modification\n3. Liskov Substitution — subtypes must be substitutable\n4. Interface Segregation — clients shouldn\'t depend on interfaces they don\'t use\n5. Dependency Inversion — depend on abstractions, not concretions\n\nUsed together they produce maintainable, testable architecture.' },
  { match: ['typescript', 'ts example', 'first one'], reply: 'Single Responsibility Principle in TypeScript:\n\n```ts\n// BAD — handles both persistence and formatting\nclass ReportService {\n  generate(report: Report): string { /* ... */ }\n  save(report: Report): void { /* ... */ }\n}\n\n// GOOD — separated responsibilities\nclass ReportFormatter {\n  format(report: Report): string { /* ... */ }\n}\n\nclass ReportRepository {\n  persist(report: Report): void { /* ... */ }\n}\n```' },
  { match: ['haiku', 'neural'], reply: 'layers pulse and hum —\nbackpropagation dreaming —\nweights align to light' },
  { match: ['design pattern', 'json'], reply: '[{"name":"Singleton","use-case":"Shared service instance with global access"},{"name":"Factory","use-case":"Object creation decoupled from call site"},{"name":"Observer","use-case":"One-to-many state propagation with loose coupling"}]' },
];

function simulateReply(text) {
  const lower = text.toLowerCase();
  for (const item of RESPONSE_DB) {
    for (const m of item.match) {
      if (lower.includes(m)) return item.reply;
    }
  }
  return 'Understood. I registered your input in conversation context.\n\nAnalysis: ' + text.length + ' characters parsed. If you\'d like a deeper technical answer, ask me about SOLID principles, TypeScript patterns, or request a one-shot completion in the tabs above.';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── NeuralEngine Main ─────────────────────────────
class NeuralEngine {
  constructor(config) {
    this.config = {
      model: 'gpt-4o', maxTokens: 1024, temperature: 0.7, topP: 1,
      frequencyPenalty: 0, presencePenalty: 0, systemPrompt: '',
      stream: false, maxRetries: 3, timeout: 30000, apiKey: ''
    };
    Object.assign(this.config, config);
    this.tokenManager = new TokenManager();
    this.streamHandler = new StreamHandler();
    this.conversationHistory = [];
    if (this.config.systemPrompt) this.conversationHistory.push({ role: 'system', content: this.config.systemPrompt });
    logger.info('NeuralEngine initialized', { model: this.config.model, maxTokens: this.config.maxTokens, temperature: this.config.temperature });
  }

  async chat(userMessage, callbacks) {
    const startTime = Date.now();
    this.conversationHistory.push({ role: 'user', content: userMessage });
    const trimmed = this.tokenManager.trimToFit(this.conversationHistory, this.config.model, this.config.maxTokens);
    logger.info('Processing chat request', { model: this.config.model, historyLength: trimmed.length, promptTokens: this.tokenManager.countMessageTokens(trimmed) });
    try {
      const response = await withRetry(() => this.executeRequest(trimmed, callbacks), { maxRetries: this.config.maxRetries });
      this.conversationHistory.push({ role: 'assistant', content: response.content });
      const latencyMs = Date.now() - startTime;
      logger.info('Chat request completed', { id: response.id, latencyMs: latencyMs + 'ms', totalTokens: response.usage.totalTokens, finishReason: response.finishReason });
      return Object.assign({}, response, { latencyMs, timestamp: new Date() });
    } catch (error) {
      this.conversationHistory.pop();
      throw error;
    }
  }

  async complete(prompt, systemPrompt, callbacks) {
    const messages = [];
    if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
    messages.push({ role: 'user', content: prompt });
    const startTime = Date.now();
    const response = await withRetry(() => this.executeRequest(messages, callbacks), { maxRetries: this.config.maxRetries });
    const latencyMs = Date.now() - startTime;
    logger.info('Completion request finished', { latencyMs: latencyMs + 'ms', model: this.config.model });
    return Object.assign({}, response, { latencyMs, timestamp: new Date() });
  }

  clearHistory(keepSystemPrompt) {
    this.conversationHistory = keepSystemPrompt ? this.conversationHistory.filter(m => m.role === 'system') : [];
    logger.info('Conversation history cleared', { keepSystemPrompt });
  }

  getHistory() { return [...this.conversationHistory]; }

  getTokenUsage() {
    const used = this.tokenManager.countMessageTokens(this.conversationHistory);
    const limit = this.tokenManager.getModelLimit(this.config.model);
    const remaining = limit - used - this.config.maxTokens;
    return { used, limit, remaining };
  }

  async executeRequest(messages, callbacks) {
    // Validate token budget (throws TokenLimitError)
    this.tokenManager.validateTokenBudget(messages, this.config.model, this.config.maxTokens);

    // Try REAL OpenAI call if API key provided
    if (this.config.apiKey && this.config.apiKey.startsWith('sk-')) {
      try {
        const body = {
          model: this.config.model,
          messages: messages.map(m => ({ role: m.role, content: m.content })),
          max_tokens: this.config.maxTokens,
          temperature: this.config.temperature,
          top_p: this.config.topP,
          stream: false
        };
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.config.apiKey },
          body: JSON.stringify(body)
        });
        if (res.status === 401) throw { message: 'INVALID_API_KEY', status: 401, code: 'AUTH_ERROR' };
        if (res.status === 429) throw { message: 'Rate limit exceeded', retryable: true, retryAfter: 5, code: 'RATE_LIMIT' };
        if (!res.ok) throw { message: 'API error ' + res.status, status: res.status, retryable: res.status >= 500, code: 'API_ERROR' };
        const data = await res.json();
        const choice = data.choices && data.choices[0];
        return {
          id: data.id || ('live-' + Date.now()),
          content: choice.message.content,
          model: data.model || this.config.model,
          finishReason: (choice.finish_reason) || 'stop',
          usage: { promptTokens: messages.length, completionTokens: 0, totalTokens: (data.usage && data.usage.total_tokens) || 0 },
          latencyMs: 0, timestamp: new Date()
        };
      } catch (e) {
        if (e.code === 'AUTH_ERROR') { logger.error('Authentication failed — invalid or missing API key'); throw e; }
        if (e.code === 'RATE_LIMIT') { throw e; }
        logger.warn('Live API call failed, falling back to local engine: ' + (e.message || e));
      }
    }

    // Simulated response (streaming or full)
    const reply = simulateReply(messages[messages.length - 1].content);
    if (this.config.stream) {
      const tokens = reply.split(' ');
      const result = await this.streamHandler.processStream(tokens, callbacks);
      const promptTokens = this.tokenManager.countMessageTokens(messages);
      return {
        id: 'stream-' + Date.now(),
        content: result.content,
        model: this.config.model,
        finishReason: result.finishReason,
        usage: { promptTokens, completionTokens: result.completionTokens, totalTokens: promptTokens + result.completionTokens },
        latencyMs: 0, timestamp: new Date()
      };
    }
    return {
      id: 'sim-' + Date.now(),
      content: reply,
      model: this.config.model,
      finishReason: 'stop',
      usage: { promptTokens: this.tokenManager.countMessageTokens(messages), completionTokens: this.tokenManager.countTextTokens(reply), totalTokens: this.tokenManager.countMessageTokens(messages) + this.tokenManager.countTextTokens(reply) },
      latencyMs: 0, timestamp: new Date()
    };
  }
}

// ─── UI ────────────────────────────────────────────
let engine = null;
let currentTab = 'chat';
const messagesEl = document.getElementById('messages');

function buildEngine(systemPromptForChat) {
  const config = {
    model: document.getElementById('cfModel').value,
    maxTokens: parseInt(document.getElementById('cfMaxTokens').value) || 1024,
    temperature: parseFloat(document.getElementById('cfTemp').value) || 0.7,
    topP: parseFloat(document.getElementById('cfTopP').value) || 1,
    maxRetries: parseInt(document.getElementById('cfRetries').value) || 3,
    apiKey: document.getElementById('cfApiKey').value.trim()
  };
  if (systemPromptForChat) config.systemPrompt = systemPromptForChat;
  return new NeuralEngine(config);
}

function applyTokenGauge(engine) {
  const usage = engine.getTokenUsage();
  const pct = Math.min(100, (usage.used / usage.limit) * 100);
  document.getElementById('tokenFill').style.width = pct + '%';
  document.getElementById('tokenLabel').textContent = usage.used.toLocaleString() + ' / ' + usage.limit.toLocaleString();
}

function addMessage(role, content, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'assistant') {
    div.innerHTML = content + '<span class="cursor"></span>';
  } else {
    div.textContent = content;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function streamInto(el, full) {
  let i = 0;
  return new Promise(resolve => {
    const iv = setInterval(() => {
      i += 3;
      const shown = full.substring(0, i);
      el.innerHTML = shown.replace(/</g, '&lt;') + (i < full.length ? '<span class="cursor"></span>' : '');
      messagesEl.scrollTop = messagesEl.scrollHeight;
      if (i >= full.length) { clearInterval(iv); resolve(); }
    }, 20);
  });
}

function finalizeMessage(el, content, meta) {
  el.textContent = content;
  const metaDiv = document.createElement('div');
  metaDiv.className = 'msg-meta';
  metaDiv.innerHTML = '<span class="tok">⚡ ' + meta.totalTokens + ' tokens</span><span class="lat">⏱ ' + meta.latencyMs + 'ms</span><span class="model">🧠 ' + meta.model + '</span><span>↻ ' + (meta.finishReason || 'stop') + '</span>';
  el.appendChild(metaDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  // Ensure engine exists for chat
  if (!engine) engine = buildEngine('You are a senior software architect. Be concise and precise.');
  else engine.config.apiKey = document.getElementById('cfApiKey').value.trim();

  addMessage('user', text);
  const assistantEl = addMessage('assistant', '');

  try {
    const response = await engine.chat(text, {
      onToken: t => { if (assistantEl) {} },
      onComplete: f => {}
    });
    await streamInto(assistantEl, response.content);
    finalizeMessage(assistantEl, response.content, response);
    logger.success('Chat exchange completed', { latencyMs: response.latencyMs + 'ms' });
  } catch (e) {
    assistantEl.textContent = 'NeuralEngineError [' + (e.code || 'UNKNOWN_ERROR') + ']: ' + (e.message || e);
    assistantEl.className = 'msg assistant';
    logger.error('Chat failed', { code: e.code, message: e.message });
  }
  applyTokenGauge(engine);
  btn.disabled = false;
}

async function runCompletion() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  const compEngine = buildEngine();
  addMessage('user', text);
  const assistantEl = addMessage('assistant', '');

  try {
    const response = await compEngine.complete(text, 'You are a JSON API. Respond only with valid JSON, no markdown.');
    let content = response.content;
    if (response.content.trim().startsWith('[') && response.content.trim().endsWith(']')) {
      const parsed = JSON.parse(response.content);
      content = JSON.stringify(parsed, null, 2);
    }
    await streamInto(assistantEl, content);
    finalizeMessage(assistantEl, content, response);
    logger.success('One-shot completion finished', { model: response.model });
  } catch (e) {
    assistantEl.textContent = 'Error: ' + (e.message || e);
    logger.error('Completion failed', { message: e.message });
  }
  btn.disabled = false;
}

function saveConfig() {
  engine = buildEngine(document.getElementById('cfSystem').value || undefined);
  applyTokenGauge(engine);
  logger.info('Engine configuration applied', { model: engine.config.model, maxTokens: engine.config.maxTokens });
  // Notify the user in chat
  const el = addMessage('system', '⚙ Engine configured → ' + engine.config.model + ' · maxTokens ' + engine.config.maxTokens + ' · temp ' + engine.config.temperature + (engine.config.apiKey ? ' · LIVE MODE (OpenAI key provided)' : ' · Local simulation mode'));
}

// Tabs
document.querySelectorAll('.chat-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    if (currentTab === 'chat') {
      document.getElementById('messages').style.display = 'flex';
      document.getElementById('events').style.display = 'none';
    } else {
      document.getElementById('messages').style.display = 'none';
      document.getElementById('events').style.display = 'block';
    }
  });
});

document.querySelectorAll('.nav li').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav li').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    if (item.dataset.view === 'events') {
      document.getElementById('messages').style.display = 'none';
      document.getElementById('events').style.display = 'block';
      document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
    } else {
      document.getElementById('messages').style.display = 'flex';
      document.getElementById('events').style.display = 'none';
    }
  });
});

// Init
engine = buildEngine('You are a senior software architect. Be concise and precise.');
addMessage('system', '🧠 Lumina Vision Neural Engine online · ' + engine.config.model + '\nMulti-turn conversation with token-budget management, exponential-backoff retry, and streaming. Enter an OpenAI API key for LIVE responses, or explore with the local engine.');
applyTokenGauge(engine);
logger.info('Lumina Vision initialised', { service: 'neural-engine' });
</script>
